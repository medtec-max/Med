<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MedScribe Pro - Top 1% Clinical Notes</title>
    
    <!-- Handwriting Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Shadows+Into+Light&family=Gochi+Hand&family=Patrick+Hand&display=swap" rel="stylesheet">
    
    <!-- html2canvas for Image Export -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <style>
        :root {
            --primary: #2563EB;
            --primary-hover: #1D4ED8;
            --bg: #F1F5F9;
            --paper: #FDFBF7; 
            --line-color: #94A3B8;
            --margin-color: #F87171;
            --ink: #0F172A;
            --font-family: 'Caveat', cursive;
            --line-height: 2.2rem; 
            --letter-spacing: normal;
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg);
            margin: 0; padding: 2rem 1rem;
            display: flex; flex-direction: column; align-items: center;
            min-height: 100vh;
            overflow-x: hidden; /* Prevent horizontal scroll on mobile */
        }

        /* --- Layout & Controls --- */
        .app-container {
            display: flex; gap: 2rem; width: 100%; max-width: 1200px;
            flex-direction: row; align-items: flex-start; justify-content: center;
        }

        .sidebar {
            width: 100%; max-width: 350px; display: flex; flex-direction: column; gap: 1rem;
        }

        .panel {
            background: white; padding: 1.5rem; border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1); box-sizing: border-box;
        }

        h2, h3 { margin-top: 0; color: #1E293B; }
        .form-group { margin-bottom: 1rem; }
        label { display: block; font-weight: 600; margin-bottom: 0.4rem; color: #475569; font-size: 0.9rem; }
        
        input[type="text"], select {
            width: 100%; padding: 0.6rem; border: 2px solid #E2E8F0;
            border-radius: 6px; box-sizing: border-box; font-size: 0.95rem;
        }
        input:focus, select:focus { outline: none; border-color: var(--primary); }

        /* Toggles */
        .checkbox-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem; }
        .checkbox-label { display: flex; align-items: center; gap: 0.5rem; font-weight: 500; font-size: 0.85rem; }

        /* Buttons */
        button {
            background-color: var(--primary); color: white; border: none;
            padding: 0.75rem; border-radius: 6px; font-weight: 600; cursor: pointer;
            width: 100%; transition: all 0.2s;
        }
        button:hover { background-color: var(--primary-hover); transform: translateY(-1px); }
        button:disabled { background-color: #9CA3AF; cursor: not-allowed; transform: none; }
        
        .btn-stop { background-color: #EF4444; display: none; margin-top: 0.5rem;}
        .btn-stop:hover { background-color: #DC2626; }

        /* History List */
        .history-list { max-height: 200px; overflow-y: auto; display: flex; flex-direction: column; gap: 0.5rem; }
        .history-item {
            padding: 0.5rem; background: #F8FAFC; border: 1px solid #E2E8F0; border-radius: 6px;
            font-size: 0.85rem; cursor: pointer; transition: 0.2s;
            word-break: break-word;
        }
        .history-item:hover { background: #E2E8F0; border-color: var(--primary); }

        /* --- Notebook Paper --- */
        .main-content { width: 100%; max-width: 800px; position: relative; }
        
        .notebook-paper {
            background-color: var(--paper); width: 100%; min-height: 1000px;
            padding: 5rem 2rem 4rem 5rem; position: relative; box-sizing: border-box;
            border-radius: 4px 12px 12px 4px; box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.1);
            background-image: repeating-linear-gradient( transparent, transparent calc(var(--line-height) - 1px),
                var(--line-color) calc(var(--line-height) - 1px), var(--line-color) var(--line-height) );
            background-position: 0 4.8rem; display: none;
            overflow: hidden; /* Prevents long unbreakable words from expanding the div */
        }

        .notebook-paper::before {
            content: ''; position: absolute; top: 0; bottom: 0; left: 3.5rem; width: 4px;
            border-left: 1px solid var(--margin-color); border-right: 1px solid var(--margin-color); opacity: 0.5;
        }

        .handwriting-text {
            font-family: var(--font-family); font-size: 1.6rem; color: var(--ink);
            margin: 0; line-height: var(--line-height); white-space: pre-wrap;
            mix-blend-mode: multiply; transform: translateY(-6px);
            letter-spacing: var(--letter-spacing); transition: all 0.3s ease;
            word-break: break-word; /* Edge case: Long unspaced words */
        }
        
        /* Editable area styling */
        .handwriting-text[contenteditable="true"] { outline: none; }
        .handwriting-text[contenteditable="true"]:focus { background-color: rgba(255,255,255,0.4); border-radius: 8px; }

        .topic-header { font-size: 2.5rem; font-weight: 700; text-decoration: underline; margin-bottom: var(--line-height); }

        /* --- Action Bars --- */
        .fab-bar {
            display: none; position: fixed; bottom: 0; left: 0; right: 0;
            background: white; padding: 1rem; box-shadow: 0 -4px 10px rgba(0,0,0,0.1);
            z-index: 100; gap: 1rem; justify-content: space-around;
        }
        .fab-bar button { padding: 0.75rem 1rem; font-size: 0.9rem; }
        .fab-btn-img { background-color: #F59E0B; }
        .fab-btn-print { background-color: #10B981; }

        .desktop-actions { display: flex; gap: 1rem; margin-top: 1rem; }
        .desktop-actions button { display: none; }

        .loader { display: none; color: var(--primary); font-weight: 600; font-size: 0.9rem; margin-top: 1rem; text-align: center;}

        /* --- Responsive Design --- */
        @media (max-width: 900px) {
            .app-container { flex-direction: column; align-items: center; }
            .sidebar { max-width: 100%; }
        }

        @media (max-width: 600px) {
            body { padding: 1rem 0.5rem; margin-bottom: 80px; }
            .notebook-paper { padding: 4rem 1rem 6rem 2.5rem; } /* Extra bottom padding so FAB doesn't cover text */
            .notebook-paper::before { left: 1.5rem; }
            .desktop-actions { display: none !important; }
            .fab-bar.active { display: flex; }
        }

        @media print {
            body { background: none; padding: 0; margin: 0; }
            .sidebar, .fab-bar, .desktop-actions { display: none !important; }
            .main-content { max-width: 100%; }
            .notebook-paper { box-shadow: none; border-radius: 0; display: block !important; }
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- Sidebar Controls -->
        <div class="sidebar">
            <div class="panel">
                <h2>🩺 MedScribe Pro</h2>
                <p style="color: #64748B; margin-top: -10px; font-size: 0.85rem;">Generate high-yield clinical notes</p>

                <div class="form-group">
                    <label>Disease / Medical Topic</label>
                    <input type="text" id="topicName" placeholder="e.g. Aortic Stenosis" maxlength="60">
                </div>

                <div class="form-group">
                    <label>Include Sections:</label>
                    <div class="checkbox-grid">
                        <label class="checkbox-label"><input type="checkbox" id="chkDef" checked> Definition & Epi</label>
                        <label class="checkbox-label"><input type="checkbox" id="chkPatho" checked> Pathophysiology</label>
                        <label class="checkbox-label"><input type="checkbox" id="chkClin" checked> Clinical Features</label>
                        <label class="checkbox-label"><input type="checkbox" id="chkDiag" checked> Investigations</label>
                        <label class="checkbox-label"><input type="checkbox" id="chkPharm" checked> Pharmacology/Tx</label>
                        <label class="checkbox-label"><input type="checkbox" id="chkComp"> Complications</label>
                    </div>
                </div>

                <button id="generateBtn" onclick="startGeneration()">✍️ Generate Notes</button>
                <button id="stopBtn" class="btn-stop" onclick="stopGeneration()">⏹ Stop Typing</button>
                <div id="loader" class="loader">🧠 Consulting medical database...</div>
            </div>

            <!-- Customization Panel -->
            <div class="panel">
                <h3>🎨 Customization</h3>
                <div class="form-group">
                    <label>Ink Color</label>
                    <select id="inkColor" onchange="updateStyles()">
                        <option value="#0F172A">Dark Blue (Classic)</option>
                        <option value="#000000">Black</option>
                        <option value="#DC2626">Red (Urgent)</option>
                        <option value="#059669">Green</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Handwriting Font</label>
                    <select id="fontStyle" onchange="updateStyles()">
                        <option value="'Caveat', cursive">Standard (Caveat)</option>
                        <option value="'Shadows Into Light', cursive">Neat (Shadows)</option>
                        <option value="'Patrick Hand', cursive">Legible (Patrick)</option>
                        <option value="'Gochi Hand', cursive">Casual (Gochi)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="checkbox-label">
                        <input type="checkbox" id="chkMessy" onchange="updateStyles()">
                        🩺 Rushed Doctor Handwriting
                    </label>
                </div>
            </div>

            <!-- History Panel -->
            <div class="panel">
                <h3>📂 Recent Notes</h3>
                <div id="historyList" class="history-list">
                    <!-- History items injected here -->
                </div>
            </div>
        </div>

        <!-- Main Notebook Area -->
        <div class="main-content">
            <div class="desktop-actions" id="desktopActions">
                <button class="fab-btn-img" onclick="exportImage()">📸 Save as Image</button>
                <button class="fab-btn-print" onclick="window.print()">🖨️ Print / PDF</button>
            </div>

            <div id="notebook" class="notebook-paper">
                <div id="notesTopic" class="handwriting-text topic-header" contenteditable="false"></div>
                <div id="notesContent" class="handwriting-text" contenteditable="false"></div>
            </div>
        </div>
    </div>

    <!-- Mobile Action Bar -->
    <div class="fab-bar" id="mobileFab">
        <button class="fab-btn-img" onclick="exportImage()">📸 Save Img</button>
        <button class="fab-btn-print" onclick="window.print()">🖨️ PDF</button>
    </div>

    <script>
        // --- STATE VARIABLES ---
        let typingTimeout;
        let isTyping = false;
        let currentFullText = "";
        
        // --- SECURITY / UTILITIES ---
        // Sanitizes HTML to prevent XSS if user types script tags
        function sanitizeString(str) {
            const temp = document.createElement('div');
            temp.textContent = str;
            return temp.innerHTML;
        }

        // --- UI CUSTOMIZATION ---
        function updateStyles() {
            const root = document.documentElement;
            root.style.setProperty('--ink', document.getElementById('inkColor').value);
            root.style.setProperty('--font-family', document.getElementById('fontStyle').value);
            
            const notesContent = document.getElementById('notesContent');
            if (document.getElementById('chkMessy').checked) {
                root.style.setProperty('--letter-spacing', '-1px');
                root.style.setProperty('--line-height', '1.8rem'); 
                notesContent.style.opacity = "0.85";
                notesContent.style.transform = "rotate(-0.5deg) translateY(-6px)";
            } else {
                root.style.setProperty('--letter-spacing', 'normal');
                root.style.setProperty('--line-height', '2.2rem');
                notesContent.style.opacity = "1";
                notesContent.style.transform = "translateY(-6px)";
            }
        }

        // --- CORE LOGIC ---
        function startGeneration() {
            let topicInput = document.getElementById('topicName').value.trim();
            
            // Edge Case: Empty input
            if (!topicInput) { 
                alert("Please enter a medical topic."); 
                return; 
            }
            // Edge Case: Too long (already capped by HTML maxlength, but double checking)
            if (topicInput.length > 60) {
                topicInput = topicInput.substring(0, 60);
            }

            const topic = sanitizeString(topicInput.charAt(0).toUpperCase() + topicInput.slice(1));

            const sections = [];
            if(document.getElementById('chkDef').checked) sections.push("Definition & Epidemiology");
            if(document.getElementById('chkPatho').checked) sections.push("Pathophysiology");
            if(document.getElementById('chkClin').checked) sections.push("Clinical Features");
            if(document.getElementById('chkDiag').checked) sections.push("Investigations & Diagnosis");
            if(document.getElementById('chkPharm').checked) sections.push("Pharmacology & Management");
            if(document.getElementById('chkComp').checked) sections.push("Complications & Prognosis");

            // Edge Case: No sections checked
            if (sections.length === 0) {
                alert("Please check at least one section to generate notes.");
                return;
            }

            // Lock UI & Reset State
            document.getElementById('generateBtn').style.display = 'none';
            document.getElementById('stopBtn').style.display = 'block';
            document.getElementById('loader').style.display = 'block';
            document.getElementById('notebook').style.display = 'none';
            disableEditing();
            clearTimeout(typingTimeout);
            isTyping = true;

            currentFullText = generateLocalNote(topic, sections);
            
            setTimeout(() => {
                document.getElementById('loader').style.display = 'none';
                document.getElementById('notebook').style.display = 'block';
                document.getElementById('notesTopic').innerText = topic;
                
                const contentDiv = document.getElementById('notesContent');
                contentDiv.innerText = ""; // Clear via innerText

                const words = currentFullText.split(/(?= |\n)/);
                let i = 0;
                let buildingText = "";
                
                function typeWriter() {
                    if (!isTyping) return; // Prevent memory leak if stopped early
                    if (i < words.length) {
                        buildingText += words[i];
                        // Using textContent prevents XSS HTML execution during typing
                        contentDiv.textContent = buildingText;
                        i++;
                        typingTimeout = setTimeout(typeWriter, 15);
                    } else {
                        finishGeneration(topic, currentFullText);
                    }
                }
                typeWriter();
            }, 600);
        }

        function stopGeneration() {
            isTyping = false;
            clearTimeout(typingTimeout);
            document.getElementById('notesContent').textContent = currentFullText;
            finishGeneration(document.getElementById('topicName').value.trim(), currentFullText);
        }

        function finishGeneration(topic, text) {
            document.getElementById('generateBtn').style.display = 'block';
            document.getElementById('stopBtn').style.display = 'none';
            enableEditing();
            showActions();
            saveToHistory(topic, text);
        }

        // --- EDITING & ACTIONS ---
        function enableEditing() {
            document.getElementById('notesContent').setAttribute('contenteditable', 'true');
            document.getElementById('notesTopic').setAttribute('contenteditable', 'true');
        }
        function disableEditing() {
            document.getElementById('notesContent').setAttribute('contenteditable', 'false');
            document.getElementById('notesTopic').setAttribute('contenteditable', 'false');
        }
        function showActions() {
            document.querySelectorAll('.desktop-actions button').forEach(b => b.style.display = 'block');
            document.getElementById('mobileFab').classList.add('active');
        }

        // --- EXPORT TO IMAGE (html2canvas) ---
        function exportImage() {
            const notebook = document.getElementById('notebook');
            const content = document.getElementById('notesContent');
            const header = document.getElementById('notesTopic');
            
            // Edge Case: Disable contenteditable so cursor/selection box doesn't appear in photo
            disableEditing();

            // Edge Case: html2canvas struggles with mix-blend-mode. Temporarily disable.
            const originalBlend = content.style.mixBlendMode;
            content.style.mixBlendMode = 'normal';

            window.scrollTo(0,0); // Prevent scroll clipping bugs in capture

            html2canvas(notebook, { scale: 2, useCORS: true }).then(canvas => {
                let link = document.createElement('a');
                link.download = `${header.innerText.replace(/[^a-z0-9]/gi, '_')}_Notes.png`; // Sanitize filename
                link.href = canvas.toDataURL("image/png");
                link.click();
                
                // Restore settings
                content.style.mixBlendMode = originalBlend;
                enableEditing();
            }).catch(err => {
                console.error("Image export failed:", err);
                alert("Failed to generate image. Please try 'Print / PDF' instead.");
                enableEditing();
            });
        }

        // --- LOCAL STORAGE HISTORY ---
        function saveToHistory(topic, text) {
            try {
                let history = JSON.parse(localStorage.getItem('medNotesHistory')) || [];
                history = history.filter(item => item.topic.toLowerCase() !== topic.toLowerCase());
                history.unshift({ topic: topic, text: text, date: new Date().toLocaleDateString() });
                if (history.length > 10) history.pop(); 
                
                localStorage.setItem('medNotesHistory', JSON.stringify(history));
                loadHistoryUI();
            } catch (e) {
                console.warn("Local storage unavailable (Private Mode) or Quota Exceeded.", e);
            }
        }

        function loadHistoryUI() {
            try {
                const history = JSON.parse(localStorage.getItem('medNotesHistory')) || [];
                const container = document.getElementById('historyList');
                container.innerHTML = "";
                
                if (history.length === 0) {
                    container.innerHTML = "<div style='color: #94A3B8; font-size: 0.85rem;'>No recent notes.</div>";
                    return;
                }

                history.forEach(item => {
                    let div = document.createElement('div');
                    div.className = "history-item";
                    // InnerHTML is safe here because we sanitized the topic string before saving
                    div.innerHTML = `<strong>${item.topic}</strong><br><small>${item.date}</small>`;
                    div.onclick = () => loadFromHistory(item.topic, item.text);
                    container.appendChild(div);
                });
            } catch (e) {
                document.getElementById('historyList').innerHTML = "<div style='color: #F87171; font-size: 0.85rem;'>History unavailable.</div>";
            }
        }

        function loadFromHistory(topic, text) {
            clearTimeout(typingTimeout);
            isTyping = false; // Stop any ongoing animation instantly
            
            document.getElementById('topicName').value = topic;
            document.getElementById('notebook').style.display = 'block';
            document.getElementById('notesTopic').innerText = topic;
            document.getElementById('notesContent').textContent = text;
            
            currentFullText = text;
            document.getElementById('loader').style.display = 'none';
            finishGeneration(topic, text);
        }

        // Initialize UI on load
        window.onload = () => { loadHistoryUI(); updateStyles(); }

        // --- LOCAL GENERATION ENGINE ---
        function generateLocalNote(topic, sections) {
            let note = "";
            let secCount = 1;

            if (sections.includes("Definition & Epidemiology")) {
                note += `${secCount++}. DEFINITION & EPIDEMIOLOGY\n• ${topic} is a significant clinical entity requiring comprehensive medical evaluation.\n• It is characterized by specific structural or functional alterations in the affected physiological system.\n• Epidemiology: Affects specific demographics depending on genetic, environmental, and lifestyle factors.\n\n`;
            }
            if (sections.includes("Pathophysiology")) {
                note += `${secCount++}. PATHOPHYSIOLOGY\n• Etiology can be classified into congenital, infectious, inflammatory, neoplastic, or idiopathic causes.\n• Pathogenesis involves cellular injury, inflammatory cascades, or metabolic derangements related to ${topic}.\n• Over time, this leads to tissue remodeling, fibrosis, or systemic dissemination.\n• Key mechanism: Disruption of normal homeostasis leading to the classic clinical presentation.\n\n`;
            }
            if (sections.includes("Clinical Features")) {
                note += `${secCount++}. CLINICAL FEATURES (HISTORY & EXAM)\n• Patients classically present with a gradual or acute onset of symptoms.\n• Subjective (Symptoms): Pain, fatigue, systemic signs of inflammation, or localized deficits.\n• Objective (Signs): Elicited during physical examination (inspection, palpation, percussion, auscultation).\n• Red Flag Signs must be identified promptly to prevent irreversible morbidity.\n\n`;
            }
            if (sections.includes("Investigations & Diagnosis")) {
                note += `${secCount++}. DIAGNOSTIC WORKUP & INVESTIGATIONS\n• Routine Bloods: CBC, U&Es, LFTs, CRP/ESR.\n• Specific Biomarkers: Targeted tests specifically elevated or altered in ${topic}.\n• Imaging: Ultrasound (first-line for many organs), CT scan (cross-sectional anatomy), or MRI (soft tissue/neuro).\n• Histopathology: Biopsy remains the definitive gold standard if applicable.\n\n`;
            }
            if (sections.includes("Pharmacology & Management")) {
                note += `${secCount++}. CLINICAL MANAGEMENT & PROTOCOL\n• Conservative: Lifestyle modifications, physical therapy, and risk factor optimization.\n• Medical / Pharmacological: Targeted drug therapy to correct the underlying mechanism or manage symptoms.\n• Surgical / Interventional: Indicated when medical management fails or in acute emergencies.\n\n`;
            }
            if (sections.includes("Complications & Prognosis")) {
                note += `${secCount++}. COMPLICATIONS & PROGNOSIS\n• If left untreated, ${topic} can lead to progressive organ failure.\n• Risk of secondary infections or systemic multi-organ involvement.\n• Prognosis depends heavily on the stage of diagnosis and patient comorbidities.\n• Requires regular multidisciplinary follow-up.\n\n`;
            }
            
            // --- ADDED REFERENCES SECTION ---
            note += `[REFERENCES & FURTHER READING]\n`;
            note += `1. Harrison's Principles of Internal Medicine, 21st Edition.\n`;
            note += `2. Robbins & Cotran Pathologic Basis of Disease, 10th Edition.\n`;
            note += `3. Standard Clinical Guidelines (UpToDate / NICE).`;
            
            return note;
        }
    </script>
</body>
</html>
