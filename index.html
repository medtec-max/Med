<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MedScribe Pro - Smart Web Engine</title>
    
    <!-- Handwriting Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Shadows+Into+Light&family=Gochi+Hand&family=Patrick+Hand&display=swap" rel="stylesheet">
    
    <!-- html2canvas for Image Export -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <style>
        :root {
            --primary: #2563EB; --primary-hover: #1D4ED8;
            --bg: #F1F5F9; --paper: #FDFBF7; 
            --line-color: #94A3B8; --margin-color: #F87171; --ink: #0F172A;
            --font-family: 'Caveat', cursive;
            --line-height: 2.2rem; --letter-spacing: normal;
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg); margin: 0; padding: 2rem 1rem;
            display: flex; flex-direction: column; align-items: center; min-height: 100vh;
            overflow-x: hidden;
        }

        /* --- Layout & Controls --- */
        .app-container {
            display: flex; gap: 2rem; width: 100%; max-width: 1200px;
            flex-direction: row; align-items: flex-start; justify-content: center;
        }

        .sidebar { width: 100%; max-width: 350px; display: flex; flex-direction: column; gap: 1rem; }

        .panel {
            background: white; padding: 1.5rem; border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1); box-sizing: border-box;
        }

        h2, h3 { margin-top: 0; color: #1E293B; }
        .form-group { margin-bottom: 1rem; }
        label { display: block; font-weight: 600; margin-bottom: 0.4rem; color: #475569; font-size: 0.9rem; }
        
        input[type="text"], select {
            width: 100%; padding: 0.6rem; border: 2px solid #E2E8F0;
            border-radius: 6px; box-sizing: border-box; font-size: 0.95rem; background: white;
        }
        input:focus, select:focus { outline: none; border-color: var(--primary); }

        .checkbox-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem; }
        .checkbox-label { display: flex; align-items: center; gap: 0.5rem; font-weight: 500; font-size: 0.85rem; }

        button {
            background-color: var(--primary); color: white; border: none;
            padding: 0.75rem; border-radius: 6px; font-weight: 600; cursor: pointer;
            width: 100%; transition: all 0.2s;
        }
        button:hover { background-color: var(--primary-hover); transform: translateY(-1px); }
        button:disabled { background-color: #9CA3AF; cursor: not-allowed; transform: none; }
        
        .btn-stop { background-color: #EF4444; display: none; margin-top: 0.5rem;}
        .btn-stop:hover { background-color: #DC2626; }

        .history-list { max-height: 200px; overflow-y: auto; display: flex; flex-direction: column; gap: 0.5rem; }
        .history-item {
            padding: 0.5rem; background: #F8FAFC; border: 1px solid #E2E8F0; border-radius: 6px;
            font-size: 0.85rem; cursor: pointer; transition: 0.2s; word-break: break-word;
        }
        .history-item:hover { background: #E2E8F0; border-color: var(--primary); }

        /* --- Notebook Paper --- */
        .main-content { width: 100%; max-width: 800px; position: relative; }
        
        .notebook-paper {
            background-color: var(--paper); width: 100%; min-height: 1000px;
            padding: 5rem 2rem 4rem 5rem; position: relative; box-sizing: border-box;
            border-radius: 4px 12px 12px 4px; box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.1);
            background-image: repeating-linear-gradient( transparent, transparent calc(var(--line-height) - 1px),
                var(--line-color) calc(var(--line-height) - 1px), var(--line-color) var(--line-height) );
            background-position: 0 4.8rem; display: none; overflow: hidden;
        }

        .notebook-paper::before {
            content: ''; position: absolute; top: 0; bottom: 0; left: 3.5rem; width: 4px;
            border-left: 1px solid var(--margin-color); border-right: 1px solid var(--margin-color); opacity: 0.5;
        }

        .handwriting-text {
            font-family: var(--font-family); font-size: 1.6rem; color: var(--ink);
            margin: 0; line-height: var(--line-height); white-space: pre-wrap;
            mix-blend-mode: multiply; transform: translateY(-6px);
            letter-spacing: var(--letter-spacing); transition: all 0.3s ease; word-break: break-word;
        }
        
        .handwriting-text[contenteditable="true"] { outline: none; }
        .handwriting-text[contenteditable="true"]:focus { background-color: rgba(255,255,255,0.4); border-radius: 8px; }

        .topic-header { font-size: 2.5rem; font-weight: 700; text-decoration: underline; margin-bottom: var(--line-height); text-align: center;}

        /* --- Action Bars & Utils --- */
        .fab-bar {
            display: none; position: fixed; bottom: 0; left: 0; right: 0;
            background: white; padding: 1rem; box-shadow: 0 -4px 10px rgba(0,0,0,0.1);
            z-index: 100; gap: 1rem; justify-content: space-around;
        }
        .fab-bar button { padding: 0.75rem 1rem; font-size: 0.9rem; }
        .fab-btn-img { background-color: #F59E0B; }
        .fab-btn-print { background-color: #10B981; }

        .desktop-actions { display: flex; gap: 1rem; margin-top: 1rem; }
        .desktop-actions button { display: none; }
        .loader { display: none; color: var(--primary); font-weight: 600; font-size: 0.9rem; margin-top: 1rem; text-align: center;}
        
        #errorMsg { color: #DC2626; font-size: 0.85rem; font-weight: 600; text-align: center; margin-top: 0.5rem; display: none; }

        /* --- Responsive Design --- */
        @media (max-width: 900px) { .app-container { flex-direction: column; align-items: center; } .sidebar { max-width: 100%; } }
        @media (max-width: 600px) {
            body { padding: 1rem 0.5rem; margin-bottom: 80px; }
            .notebook-paper { padding: 4rem 1rem 6rem 2.5rem; }
            .notebook-paper::before { left: 1.5rem; }
            .desktop-actions { display: none !important; }
            .fab-bar.active { display: flex; }
        }
        @media print {
            body { background: none; padding: 0; margin: 0; }
            .sidebar, .fab-bar, .desktop-actions { display: none !important; }
            .main-content { max-width: 100%; }
            .notebook-paper { box-shadow: none; border-radius: 0; display: block !important; }
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- Sidebar Controls -->
        <div class="sidebar">
            <div class="panel">
                <h2>🩺 MedScribe Pro</h2>
                <p style="color: #64748B; margin-top: -10px; font-size: 0.85rem;">Smart search extracts notes directly from live medical databases.</p>

                <div class="form-group">
                    <label>Disease / Medical Keyword</label>
                    <input type="text" id="topicName" placeholder="e.g. Diabetics, Heart attack..." maxlength="60">
                </div>

                <div class="form-group">
                    <label>Include Sections:</label>
                    <div class="checkbox-grid">
                        <label class="checkbox-label"><input type="checkbox" id="chkDef" value="Definition" checked> Definition/Gen</label>
                        <label class="checkbox-label"><input type="checkbox" id="chkPatho" value="Pathophysiology" checked> Pathophysiology</label>
                        <label class="checkbox-label"><input type="checkbox" id="chkClin" value="Clinical Features" checked> Clinical Features</label>
                        <label class="checkbox-label"><input type="checkbox" id="chkDiag" value="Investigations" checked> Investigations</label>
                        <label class="checkbox-label"><input type="checkbox" id="chkPharm" value="Management" checked> Management</label>
                        <label class="checkbox-label"><input type="checkbox" id="chkComp" value="Complications" checked> Complications</label>
                    </div>
                </div>

                <button id="generateBtn" onclick="startGeneration()">🌐 Smart Search & Generate</button>
                <button id="stopBtn" class="btn-stop" onclick="stopGeneration()">⏹ Stop Typing</button>
                
                <div id="loader" class="loader">🌐 Finding best match... Please wait.</div>
                <div id="errorMsg"></div>
            </div>

            <div class="panel">
                <h3>🎨 Customization</h3>
                <div class="form-group">
                    <label>Ink Color</label>
                    <select id="inkColor" onchange="updateStyles()">
                        <option value="#0F172A">Dark Blue (Classic)</option>
                        <option value="#000000">Black</option>
                        <option value="#DC2626">Red (Urgent)</option>
                        <option value="#059669">Green</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Handwriting Font</label>
                    <select id="fontStyle" onchange="updateStyles()">
                        <option value="'Caveat', cursive">Standard (Caveat)</option>
                        <option value="'Shadows Into Light', cursive">Neat (Shadows)</option>
                        <option value="'Patrick Hand', cursive">Legible (Patrick)</option>
                        <option value="'Gochi Hand', cursive">Casual (Gochi)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="checkbox-label">
                        <input type="checkbox" id="chkMessy" onchange="updateStyles()">
                        🩺 Rushed Doctor Handwriting
                    </label>
                </div>
            </div>

            <div class="panel">
                <h3>📂 Recent Notes</h3>
                <div id="historyList" class="history-list"></div>
            </div>
        </div>

        <!-- Main Notebook Area -->
        <div class="main-content">
            <div class="desktop-actions" id="desktopActions">
                <button class="fab-btn-img" onclick="exportImage()">📸 Save as Image</button>
                <button class="fab-btn-print" onclick="window.print()">🖨️ Print / PDF</button>
            </div>

            <div id="notebook" class="notebook-paper">
                <div id="notesTopic" class="handwriting-text topic-header" contenteditable="false"></div>
                <div id="notesContent" class="handwriting-text" contenteditable="false"></div>
            </div>
        </div>
    </div>

    <!-- Mobile Action Bar -->
    <div class="fab-bar" id="mobileFab">
        <button class="fab-btn-img" onclick="exportImage()">📸 Save Img</button>
        <button class="fab-btn-print" onclick="window.print()">🖨️ PDF</button>
    </div>

    <script>
        // --- STATE VARIABLES ---
        let typingTimeout;
        let isTyping = false;
        let currentFullText = "";
        
        // Security logic to prevent XSS
        function sanitizeString(str) {
            const temp = document.createElement('div');
            temp.textContent = str;
            return temp.innerHTML;
        }

        // Font and CSS update logic
        function updateStyles() {
            const root = document.documentElement;
            root.style.setProperty('--ink', document.getElementById('inkColor').value);
            root.style.setProperty('--font-family', document.getElementById('fontStyle').value);
            
            const notesContent = document.getElementById('notesContent');
            if (document.getElementById('chkMessy').checked) {
                root.style.setProperty('--letter-spacing', '-1px');
                root.style.setProperty('--line-height', '1.8rem'); 
                notesContent.style.opacity = "0.85";
                notesContent.style.transform = "rotate(-0.5deg) translateY(-6px)";
            } else {
                root.style.setProperty('--letter-spacing', 'normal');
                root.style.setProperty('--line-height', '2.2rem');
                notesContent.style.opacity = "1";
                notesContent.style.transform = "translateY(-6px)";
            }
        }

        // --- SMART LIVE WIKIPEDIA SEARCH LOGIC ---
        async function fetchLiveMedicalData(topic) {
            // STEP 1: Search for the closest matching medical term (Fuzzy Match)
            const searchUrl = `https://en.wikipedia.org/w/api.php?action=query&list=search&srsearch=${encodeURIComponent(topic)}&utf8=&format=json&origin=*`;
            const searchRes = await fetch(searchUrl);
            if (!searchRes.ok) throw new Error("Failed to connect to Wikipedia API.");
            const searchData = await searchRes.json();

            if (!searchData.query.search || searchData.query.search.length === 0) {
                throw new Error(`Could not find any medical topics related to "${topic}". Try checking your spelling.`);
            }

            // STEP 2: Loop through the top 3 results to find an actual article (skip disambiguation pages)
            for (let i = 0; i < Math.min(3, searchData.query.search.length); i++) {
                let bestMatchTitle = searchData.query.search[i].title;

                const extractUrl = `https://en.wikipedia.org/w/api.php?action=query&prop=extracts&explaintext=1&titles=${encodeURIComponent(bestMatchTitle)}&format=json&origin=*`;
                const extractRes = await fetch(extractUrl);
                const extractData = await extractRes.json();
                const pages = extractData.query.pages;
                const pageId = Object.keys(pages)[0];

                if (pageId !== "-1") {
                    const extract = pages[pageId].extract;
                    
                    // If it's not a disambiguation page and has enough content, return it!
                    if (!extract.includes("may refer to:") && extract.length > 250) {
                        return {
                            text: extract,
                            actualTitle: bestMatchTitle // We return the correct title to fix the UI!
                        };
                    }
                }
            }
            
            throw new Error(`The term "${topic}" is too vague and refers to multiple things. Try to be more specific.`);
        }

        // --- INTELLIGENT SENTENCE EXTRACTION & CATEGORIZATION ---
        function extractNotesFromText(rawText, actualTitle, activeSections) {
            // Remove Wikipedia section headers (e.g., "== Signs and symptoms ==")
            let cleanText = rawText.replace(/==+.*?==+/g, ''); 
            
            // Split into sentences using punctuation followed by capital letters
            let sentences = cleanText.match(/[^.!?]+[.!?]+/g) || [];
            sentences = sentences.map(s => s.trim()).filter(s => s.length > 15);
            
            let extractedData = {
                "Definition": [], "Pathophysiology": [], "Clinical Features": [], 
                "Investigations": [], "Management": [], "Complications": [], "General": []
            };

            const titleLower = actualTitle.toLowerCase();

            // Analyze every sentence and categorize using NLP keywords
            for (let i = 0; i < sentences.length; i++) {
                let noteChunk = sentences[i];
                let lowerNote = noteChunk.toLowerCase();

                // Grab next sentence for context if current is too short
                if (i + 1 < sentences.length && sentences[i+1].length < 100) {
                    noteChunk += " " + sentences[i+1];
                    i++; 
                }

                // Categorization Logic
                if (activeSections.includes("Definition") && i < 5) {
                    // First few sentences of a wiki article usually define the condition
                    extractedData["Definition"].push(noteChunk);
                } else if (activeSections.includes("Pathophysiology") && lowerNote.match(/\b(pathology|cause|mechan|etiolog|due to|result in|mutat|genetic)\b/)) {
                    extractedData["Pathophysiology"].push(noteChunk);
                } else if (activeSections.includes("Clinical Features") && lowerNote.match(/\b(symptom|sign|present|pain|exam|complain|clinic|syndrome)\b/)) {
                    extractedData["Clinical Features"].push(noteChunk);
                } else if (activeSections.includes("Investigations") && lowerNote.match(/\b(test|mri|ct |x-?ray|blood|level|diagnos|investig|scan|assay|biopsy)\b/)) {
                    extractedData["Investigations"].push(noteChunk);
                } else if (activeSections.includes("Management") && lowerNote.match(/\b(treat|therap|medic|manag|drug|dose|surg|iv|oral|prescrib)\b/)) {
                    extractedData["Management"].push(noteChunk);
                } else if (activeSections.includes("Complications") && lowerNote.match(/\b(complicat|risk|fatal|death|prognos|surviv|severe)\b/)) {
                    extractedData["Complications"].push(noteChunk);
                } else {
                    // General fallback if it contains the actual corrected title
                    if (lowerNote.includes(titleLower)) {
                        extractedData["General"].push(noteChunk);
                    }
                }
            }

            // Format into final notebook string
            let finalOutput = "";
            let secCount = 1;

            activeSections.forEach(section => {
                let sectionData = [...new Set(extractedData[section])]; // Deduplicate
                if (sectionData.length > 0) {
                    finalOutput += `${secCount++}. ${section.toUpperCase()}\n`;
                    // Limit to 4 most relevant bullet points per section to fit nicely on the page
                    sectionData.slice(0, 4).forEach(point => { 
                        finalOutput += `• ${point}\n`;
                    });
                    finalOutput += "\n";
                }
            });

            // Fallback: If keyword sections were empty, dump general facts
            if (finalOutput.trim() === "") {
                let generalData = [...new Set(extractedData["General"])];
                if (generalData.length > 0) {
                    finalOutput += `${secCount}. GENERAL FINDINGS\n`;
                    generalData.slice(0, 6).forEach(point => { finalOutput += `• ${point}\n`; });
                    finalOutput += "\n";
                }
            }

            return finalOutput.trim() === "" ? null : finalOutput;
        }

        // --- UI TRIGGER LOGIC ---
        async function startGeneration() {
            let topicInput = document.getElementById('topicName').value.trim();
            const errorMsg = document.getElementById('errorMsg');
            errorMsg.style.display = 'none';
            
            if (!topicInput) { alert("Please enter a medical topic keyword."); return; }
            if (topicInput.length > 60) topicInput = topicInput.substring(0, 60);

            const topic = sanitizeString(topicInput);

            // Get active sections
            const checkboxes = document.querySelectorAll('.checkbox-grid input[type="checkbox"]:checked');
            const activeSections = Array.from(checkboxes).map(cb => cb.value);

            if (activeSections.length === 0) {
                alert("Please check at least one section."); return;
            }

            // Lock UI & Setup Load State
            document.getElementById('generateBtn').style.display = 'none';
            document.getElementById('stopBtn').style.display = 'block';
            document.getElementById('loader').style.display = 'block';
            document.getElementById('notebook').style.display = 'none';
            disableEditing();
            clearTimeout(typingTimeout);
            isTyping = true;

            try {
                // 1. Fetch live text and get the CORRECTED title from the smart search
                const result = await fetchLiveMedicalData(topic);
                const rawLiveText = result.text;
                const correctedTitle = result.actualTitle; // e.g. "Diabetics" -> "Diabetes"
                
                // 2. Extract and format the notes using the corrected title
                let extractedNotes = extractNotesFromText(rawLiveText, correctedTitle, activeSections);

                if (!extractedNotes) {
                    throw new Error(`Could not generate structured clinical notes for "${correctedTitle}". Try a more specific term.`);
                }

                // 3. Append Final References Section (Live Source Citation)
                extractedNotes += `\n[REFERENCES & EVIDENCE]\n`;
                extractedNotes += `1. Data extracted live from Open Medical Databases via Wikipedia API.\n`;
                extractedNotes += `2. Source URL: https://en.wikipedia.org/wiki/${encodeURIComponent(correctedTitle)}`;

                currentFullText = extractedNotes;

                // 4. Update UI with the CORRECTED title
                document.getElementById('topicName').value = correctedTitle; // Auto-correct the input box
                document.getElementById('loader').style.display = 'none';
                document.getElementById('notebook').style.display = 'block';
                document.getElementById('notesTopic').innerText = correctedTitle;
                
                const contentDiv = document.getElementById('notesContent');
                contentDiv.innerText = ""; 

                // 5. Animate typing
                const words = currentFullText.split(/(?= |\n)/);
                let i = 0; let buildingText = "";
                
                function typeWriter() {
                    if (!isTyping) return; 
                    if (i < words.length) {
                        buildingText += words[i];
                        contentDiv.textContent = buildingText; 
                        i++;
                        typingTimeout = setTimeout(typeWriter, 12); // Typing speed
                    } else {
                        finishGeneration(correctedTitle, currentFullText);
                    }
                }
                typeWriter();

            } catch (err) {
                console.error(err);
                document.getElementById('loader').style.display = 'none';
                document.getElementById('generateBtn').style.display = 'block';
                document.getElementById('stopBtn').style.display = 'none';
                errorMsg.innerText = "Error: " + err.message;
                errorMsg.style.display = 'block';
                isTyping = false;
            }
        }

        function stopGeneration() {
            isTyping = false;
            clearTimeout(typingTimeout);
            document.getElementById('notesContent').textContent = currentFullText;
            const currentTitle = document.getElementById('notesTopic').innerText;
            finishGeneration(currentTitle, currentFullText);
        }

        function finishGeneration(topic, text) {
            document.getElementById('generateBtn').style.display = 'block';
            document.getElementById('stopBtn').style.display = 'none';
            enableEditing();
            showActions();
            saveToHistory(topic, text);
        }

        function enableEditing() {
            document.getElementById('notesContent').setAttribute('contenteditable', 'true');
            document.getElementById('notesTopic').setAttribute('contenteditable', 'true');
        }
        function disableEditing() {
            document.getElementById('notesContent').setAttribute('contenteditable', 'false');
            document.getElementById('notesTopic').setAttribute('contenteditable', 'false');
        }
        function showActions() {
            document.querySelectorAll('.desktop-actions button').forEach(b => b.style.display = 'block');
            document.getElementById('mobileFab').classList.add('active');
        }

        function exportImage() {
            const notebook = document.getElementById('notebook');
            const content = document.getElementById('notesContent');
            const header = document.getElementById('notesTopic');
            
            // Hide cursor/selection before taking screenshot
            disableEditing();
            
            const originalBlend = content.style.mixBlendMode;
            content.style.mixBlendMode = 'normal';
            window.scrollTo(0,0); 

            html2canvas(notebook, { scale: 2, useCORS: true }).then(canvas => {
                let link = document.createElement('a');
                link.download = `${header.innerText.replace(/[^a-z0-9]/gi, '_')}_Notes.png`; 
                link.href = canvas.toDataURL("image/png");
                link.click();
                
                content.style.mixBlendMode = originalBlend;
                enableEditing();
            }).catch(err => {
                alert("Failed to generate image. Please try 'Print / PDF' instead.");
                enableEditing();
            });
        }

        function saveToHistory(topic, text) {
            try {
                let history = JSON.parse(localStorage.getItem('medNotesHistory')) || [];
                history = history.filter(item => item.topic.toLowerCase() !== topic.toLowerCase());
                history.unshift({ topic: topic, text: text, date: new Date().toLocaleDateString() });
                if (history.length > 10) history.pop(); 
                localStorage.setItem('medNotesHistory', JSON.stringify(history));
                loadHistoryUI();
            } catch (e) {}
        }

        function loadHistoryUI() {
            try {
                const history = JSON.parse(localStorage.getItem('medNotesHistory')) || [];
                const container = document.getElementById('historyList');
                container.innerHTML = "";
                if (history.length === 0) {
                    container.innerHTML = "<div style='color: #94A3B8; font-size: 0.85rem;'>No recent notes.</div>";
                    return;
                }
                history.forEach(item => {
                    let div = document.createElement('div');
                    div.className = "history-item";
                    div.innerHTML = `<strong>${item.topic}</strong><br><small>${item.date}</small>`;
                    div.onclick = () => loadFromHistory(item.topic, item.text);
                    container.appendChild(div);
                });
            } catch (e) {
                document.getElementById('historyList').innerHTML = "<div style='color: #F87171; font-size: 0.85rem;'>History unavailable.</div>";
            }
        }

        function loadFromHistory(topic, text) {
            clearTimeout(typingTimeout); isTyping = false; 
            document.getElementById('topicName').value = topic;
            document.getElementById('notebook').style.display = 'block';
            document.getElementById('notesTopic').innerText = topic;
            document.getElementById('notesContent').textContent = text;
            currentFullText = text;
            document.getElementById('loader').style.display = 'none';
            finishGeneration(topic, text);
        }

        window.onload = () => { loadHistoryUI(); updateStyles(); }

    </script>
</body>
</html>
